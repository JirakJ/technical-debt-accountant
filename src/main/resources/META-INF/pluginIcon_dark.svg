<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40">
  <defs>
    <linearGradient id="bodyDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#43A047"/>
      <stop offset="1" stop-color="#1B5E20"/>
    </linearGradient>
  </defs>
  <!-- Ledger card -->
  <rect x="6" y="4" width="28" height="32" rx="5" fill="url(#bodyDark)" stroke="#66BB6A" stroke-width="1"/>
  <!-- Screen / report area -->
  <rect x="10" y="8" width="20" height="13" rx="2" fill="#0F2A12"/>
  <!-- Dollar mark -->
  <text x="20" y="18.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#A5D6A7">$</text>
  <!-- Debt accent dot -->
  <circle cx="26.5" cy="11.5" r="1.6" fill="#FFB74D"/>
  <!-- Keypad / tally rows -->
  <rect x="10" y="25" width="9" height="3" rx="1" fill="#2E7D32"/>
  <rect x="21" y="25" width="9" height="3" rx="1" fill="#2E7D32"/>
  <rect x="10" y="30" width="9" height="3" rx="1" fill="#2E7D32"/>
  <rect x="21" y="30" width="9" height="3" rx="1" fill="#E65100"/>
</svg>
