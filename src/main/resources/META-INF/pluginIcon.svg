<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40">
  <!-- Calculator body -->
  <rect x="8" y="4" width="24" height="32" rx="3" fill="#43A047" stroke="#2E7D32" stroke-width="1.5"/>
  <!-- Screen -->
  <rect x="11" y="7" width="18" height="8" rx="1.5" fill="#E8F5E9"/>
  <!-- Dollar sign on screen -->
  <text x="20" y="14" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" font-weight="bold" fill="#2E7D32">$</text>
  <!-- Buttons grid -->
  <rect x="11" y="18" width="4" height="3" rx="0.5" fill="#A5D6A7"/>
  <rect x="17" y="18" width="4" height="3" rx="0.5" fill="#A5D6A7"/>
  <rect x="23" y="18" width="6" height="3" rx="0.5" fill="#FF8F00"/>
  <rect x="11" y="23" width="4" height="3" rx="0.5" fill="#A5D6A7"/>
  <rect x="17" y="23" width="4" height="3" rx="0.5" fill="#A5D6A7"/>
  <rect x="23" y="23" width="6" height="3" rx="0.5" fill="#A5D6A7"/>
  <rect x="11" y="28" width="4" height="3" rx="0.5" fill="#A5D6A7"/>
  <rect x="17" y="28" width="4" height="3" rx="0.5" fill="#A5D6A7"/>
  <rect x="23" y="28" width="6" height="3" rx="0.5" fill="#FF8F00"/>
  <!-- Debt warning badge -->
  <circle cx="33" cy="8" r="5" fill="#FF5722"/>
  <text x="33" y="10.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="7" font-weight="bold" fill="white">!</text>
</svg>
