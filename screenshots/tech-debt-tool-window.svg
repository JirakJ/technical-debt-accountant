<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <style>
      .mono { font-family: 'JetBrains Mono', 'SF Mono', Menlo, monospace; }
      .hdr { fill: #BBBBBB; font-size: 13px; font-weight: 600; }
      .cell { fill: #BBBBBB; font-size: 13px; }
      .dim { fill: #808080; font-size: 13px; }
    </style>
  </defs>

  <!-- IDE background -->
  <rect width="1280" height="800" fill="#2B2B2B"/>

  <!-- Window title bar -->
  <rect width="1280" height="36" fill="#3C3F41"/>
  <circle cx="22" cy="18" r="6" fill="#FF5F57"/>
  <circle cx="42" cy="18" r="6" fill="#FEBC2E"/>
  <circle cx="62" cy="18" r="6" fill="#28C840"/>
  <text x="640" y="23" text-anchor="middle" fill="#9DA0A3" font-size="13">acme-payments — IntelliJ IDEA</text>

  <!-- Editor area (dimmed backdrop) -->
  <rect y="36" width="1280" height="330" fill="#2B2B2B"/>
  <g class="mono" font-size="13">
    <text x="20" y="70" fill="#606366">42</text>
    <text x="56" y="70" fill="#CC7832">fun</text>
    <text x="88" y="70" fill="#FFC66D">processRefund</text>
    <text x="196" y="70" fill="#A9B7C6">(order: Order): Result {</text>
    <text x="20" y="94" fill="#606366">43</text>
    <text x="72" y="94" fill="#808080">// FIXME: retry logic duplicated from CheckoutService</text>
    <text x="20" y="118" fill="#606366">44</text>
    <text x="72" y="118" fill="#A9B7C6">val gateway = LegacyGatewayAdapter(config)</text>
    <text x="20" y="142" fill="#606366">45</text>
    <text x="72" y="142" fill="#808080">// HACK: sleep to avoid race with ledger sync</text>
    <text x="20" y="166" fill="#606366">46</text>
    <text x="72" y="166" fill="#A9B7C6">Thread.sleep(</text>
    <text x="173" y="166" fill="#6897BB">250</text>
    <text x="196" y="166" fill="#A9B7C6">)</text>
    <text x="20" y="190" fill="#606366">47</text>
    <text x="72" y="190" fill="#A9B7C6">return gateway.refund(order.id)</text>
    <text x="20" y="214" fill="#606366">48</text>
    <text x="56" y="214" fill="#A9B7C6">}</text>
  </g>
  <!-- gutter debt icons -->
  <rect x="44" y="84" width="8" height="8" rx="2" fill="#E06C75"/>
  <rect x="44" y="132" width="8" height="8" rx="2" fill="#E06C75"/>

  <!-- Tool window -->
  <rect y="366" width="1280" height="434" fill="#3C3F41"/>
  <rect y="366" width="1280" height="30" fill="#313335"/>
  <text x="16" y="386" fill="#BBBBBB" font-size="13" font-weight="600">Tech Debt — Debt Inventory</text>

  <!-- summary row -->
  <text x="16" y="424" fill="#BBBBBB" font-size="13">Active Items: <tspan font-weight="700" fill="#FFFFFF">12</tspan>   |   Total Workaround Cost: <tspan font-weight="700" fill="#73C991">$3,840.00</tspan>   |   Estimated Fix Cost: <tspan font-weight="700" fill="#E5C07B">$5,120.00</tspan></text>

  <!-- table header -->
  <rect x="16" y="438" width="1248" height="28" fill="#45494A"/>
  <text x="28" y="457" class="hdr">ID</text>
  <text x="110" y="457" class="hdr">File</text>
  <text x="420" y="457" class="hdr">Category</text>
  <text x="580" y="457" class="hdr">Priority</text>
  <text x="680" y="457" class="hdr">Description</text>
  <text x="1060" y="457" class="hdr">Workaround (min)</text>
  <text x="1200" y="457" class="hdr">Resolved</text>

  <!-- rows -->
  <g>
    <rect x="16" y="466" width="1248" height="26" fill="#3C3F41"/>
    <text x="28" y="484" class="cell mono">a3f29b1c</text>
    <text x="110" y="484" class="cell mono">src/payment/RefundService.kt</text>
    <text x="420" y="484" class="cell">Code Smell</text>
    <text x="580" y="484" class="cell" fill="#E06C75" font-weight="600">Critical</text>
    <text x="680" y="484" class="cell">FIXME: retry logic duplicated from CheckoutService</text>
    <text x="1100" y="484" class="cell">420</text>
    <text x="1210" y="484" class="dim">false</text>
  </g>
  <g>
    <rect x="16" y="492" width="1248" height="26" fill="#414547"/>
    <text x="28" y="510" class="cell mono">7c81d04e</text>
    <text x="110" y="510" class="cell mono">src/payment/LegacyGatewayAdapter.kt</text>
    <text x="420" y="510" class="cell">Architecture Violation</text>
    <text x="580" y="510" class="cell" fill="#E5986C" font-weight="600">High</text>
    <text x="680" y="510" class="cell">HACK: sleep to avoid race with ledger sync</text>
    <text x="1100" y="510" class="cell">310</text>
    <text x="1210" y="510" class="dim">false</text>
  </g>
  <g>
    <rect x="16" y="518" width="1248" height="26" fill="#3C3F41"/>
    <text x="28" y="536" class="cell mono">f04b77a2</text>
    <text x="110" y="536" class="cell mono">src/ledger/LedgerSync.kt</text>
    <text x="420" y="536" class="cell">Performance Issue</text>
    <text x="580" y="536" class="cell" fill="#E5986C" font-weight="600">High</text>
    <text x="680" y="536" class="cell">OPTIMIZE: full table scan on every sync tick</text>
    <text x="1100" y="536" class="cell">240</text>
    <text x="1210" y="536" class="dim">false</text>
  </g>
  <g>
    <rect x="16" y="544" width="1248" height="26" fill="#414547"/>
    <text x="28" y="562" class="cell mono">b91e3c55</text>
    <text x="110" y="562" class="cell mono">src/api/WebhookController.kt</text>
    <text x="420" y="562" class="cell">Missing Tests</text>
    <text x="580" y="562" class="cell" fill="#E5C07B" font-weight="600">Medium</text>
    <text x="680" y="562" class="cell">No coverage for signature verification edge cases</text>
    <text x="1100" y="562" class="cell">95</text>
    <text x="1210" y="562" class="dim">false</text>
  </g>
  <g>
    <rect x="16" y="570" width="1248" height="26" fill="#3C3F41"/>
    <text x="28" y="588" class="cell mono">2d6a9f10</text>
    <text x="110" y="588" class="cell mono">build.gradle.kts</text>
    <text x="420" y="588" class="cell">Outdated Dependency</text>
    <text x="580" y="588" class="cell" fill="#E5C07B" font-weight="600">Medium</text>
    <text x="680" y="588" class="cell">TODO: bump kotlinx-serialization past CVE-flagged version</text>
    <text x="1100" y="588" class="cell">60</text>
    <text x="1210" y="588" class="dim">false</text>
  </g>
  <g>
    <rect x="16" y="596" width="1248" height="26" fill="#414547"/>
    <text x="28" y="614" class="cell mono">c77f0e83</text>
    <text x="110" y="614" class="cell mono">src/config/FeatureFlags.kt</text>
    <text x="420" y="614" class="cell">Hardcoded Value</text>
    <text x="580" y="614" class="cell" fill="#98C379" font-weight="600">Low</text>
    <text x="680" y="614" class="cell">TODO: move rollout percentages to remote config</text>
    <text x="1100" y="614" class="cell">30</text>
    <text x="1210" y="614" class="dim">false</text>
  </g>
  <g>
    <rect x="16" y="622" width="1248" height="26" fill="#3C3F41"/>
    <text x="28" y="640" class="cell mono">e1205bd7</text>
    <text x="110" y="640" class="cell mono">src/payment/CurrencyMath.kt</text>
    <text x="420" y="640" class="cell">Copy-Paste Code</text>
    <text x="580" y="640" class="cell" fill="#98C379" font-weight="600">Low</text>
    <text x="680" y="640" class="cell">Rounding helpers duplicated in three modules</text>
    <text x="1100" y="640" class="cell">45</text>
    <text x="1210" y="640" class="dim">true</text>
  </g>

  <!-- buttons -->
  <g font-size="13">
    <rect x="16" y="700" width="128" height="32" rx="4" fill="#4A88C7"/>
    <text x="80" y="721" text-anchor="middle" fill="#FFFFFF">Add Debt Item</text>
    <rect x="156" y="700" width="140" height="32" rx="4" fill="#4F5355" stroke="#5E6264"/>
    <text x="226" y="721" text-anchor="middle" fill="#BBBBBB">Resolve Selected</text>
    <rect x="308" y="700" width="142" height="32" rx="4" fill="#4F5355" stroke="#5E6264"/>
    <text x="379" y="721" text-anchor="middle" fill="#BBBBBB">Generate Report</text>
  </g>

  <!-- status bar -->
  <rect y="776" width="1280" height="24" fill="#3C3F41"/>
  <text x="16" y="792" fill="#808080" font-size="12">Technical Debt Accountant: 12 active items · $3,840 accumulated workaround cost</text>
</svg>
