<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <style>
      .mono { font-family: 'JetBrains Mono', 'SF Mono', Menlo, monospace; }
    </style>
  </defs>

  <rect width="1280" height="800" fill="#2B2B2B"/>
  <rect width="1280" height="36" fill="#3C3F41"/>
  <circle cx="22" cy="18" r="6" fill="#FF5F57"/>
  <circle cx="42" cy="18" r="6" fill="#FEBC2E"/>
  <circle cx="62" cy="18" r="6" fill="#28C840"/>
  <text x="640" y="23" text-anchor="middle" fill="#9DA0A3" font-size="13">acme-payments — IntelliJ IDEA</text>

  <!-- left: dialog -->
  <rect x="60" y="160" width="500" height="320" rx="8" fill="#3C3F41" stroke="#515658"/>
  <rect x="60" y="160" width="500" height="40" rx="8" fill="#45494A"/>
  <rect x="60" y="180" width="500" height="20" fill="#45494A"/>
  <text x="80" y="186" fill="#FFFFFF" font-size="14" font-weight="600">Export Debt Inventory</text>

  <text x="84" y="232" fill="#BBBBBB" font-size="13">Exports include workaround and fix costs computed</text>
  <text x="84" y="252" fill="#BBBBBB" font-size="13">from your hourly rate.</text>

  <circle cx="94" cy="290" r="8" fill="none" stroke="#4A88C7" stroke-width="2"/>
  <circle cx="94" cy="290" r="4" fill="#4A88C7"/>
  <text x="112" y="295" fill="#DDDDDD" font-size="13">CSV — opens in Excel / Google Sheets</text>

  <circle cx="94" cy="324" r="8" fill="none" stroke="#7F8486" stroke-width="2"/>
  <text x="112" y="329" fill="#BBBBBB" font-size="13">JSON — summary plus per-item costs</text>

  <rect x="86" y="350" width="16" height="16" rx="3" fill="none" stroke="#7F8486" stroke-width="2"/>
  <text x="112" y="363" fill="#BBBBBB" font-size="13">Include resolved items</text>

  <rect x="330" y="416" width="90" height="34" rx="4" fill="#4A88C7"/>
  <text x="375" y="438" text-anchor="middle" fill="#FFFFFF" font-size="13">OK</text>
  <rect x="436" y="416" width="100" height="34" rx="4" fill="#4F5355" stroke="#5E6264"/>
  <text x="486" y="438" text-anchor="middle" fill="#BBBBBB" font-size="13">Cancel</text>

  <!-- right: spreadsheet preview -->
  <rect x="620" y="100" width="600" height="600" rx="8" fill="#FFFFFF" stroke="#515658"/>
  <rect x="620" y="100" width="600" height="36" rx="8" fill="#F1F3F4"/>
  <rect x="620" y="118" width="600" height="18" fill="#F1F3F4"/>
  <text x="640" y="124" fill="#3C4043" font-size="13" font-weight="600">debt-inventory.csv</text>

  <!-- header row -->
  <rect x="620" y="136" width="600" height="28" fill="#E8EAED"/>
  <g fill="#3C4043" font-size="12" font-weight="700">
    <text x="636" y="155">filePath</text>
    <text x="836" y="155">priority</text>
    <text x="916" y="155">workMin</text>
    <text x="990" y="155">workCost</text>
    <text x="1072" y="155">fixCost</text>
    <text x="1148" y="155">currency</text>
  </g>
  <g fill="#3C4043" font-size="12">
    <g><rect x="620" y="164" width="600" height="26" fill="#FFFFFF"/>
      <text x="636" y="182" class="mono">payment/RefundService.kt</text>
      <text x="836" y="182" fill="#C5221F" font-weight="700">CRITICAL</text>
      <text x="916" y="182">420</text><text x="990" y="182">560.00</text><text x="1072" y="182">200.00</text><text x="1148" y="182">USD</text></g>
    <g><rect x="620" y="190" width="600" height="26" fill="#F8F9FA"/>
      <text x="636" y="208" class="mono">payment/LegacyGateway….kt</text>
      <text x="836" y="208" fill="#E37400" font-weight="700">HIGH</text>
      <text x="916" y="208">310</text><text x="990" y="208">413.33</text><text x="1072" y="208">160.00</text><text x="1148" y="208">USD</text></g>
    <g><rect x="620" y="216" width="600" height="26" fill="#FFFFFF"/>
      <text x="636" y="234" class="mono">ledger/LedgerSync.kt</text>
      <text x="836" y="234" fill="#E37400" font-weight="700">HIGH</text>
      <text x="916" y="234">240</text><text x="990" y="234">320.00</text><text x="1072" y="234">160.00</text><text x="1148" y="234">USD</text></g>
    <g><rect x="620" y="242" width="600" height="26" fill="#F8F9FA"/>
      <text x="636" y="260" class="mono">api/WebhookController.kt</text>
      <text x="836" y="260" fill="#F9AB00" font-weight="700">MEDIUM</text>
      <text x="916" y="260">95</text><text x="990" y="260">126.67</text><text x="1072" y="260">120.00</text><text x="1148" y="260">USD</text></g>
    <g><rect x="620" y="268" width="600" height="26" fill="#FFFFFF"/>
      <text x="636" y="286" class="mono">build.gradle.kts</text>
      <text x="836" y="286" fill="#F9AB00" font-weight="700">MEDIUM</text>
      <text x="916" y="286">60</text><text x="990" y="286">80.00</text><text x="1072" y="286">80.00</text><text x="1148" y="286">USD</text></g>
    <g><rect x="620" y="294" width="600" height="26" fill="#F8F9FA"/>
      <text x="636" y="312" class="mono">config/FeatureFlags.kt</text>
      <text x="836" y="312" fill="#188038" font-weight="700">LOW</text>
      <text x="916" y="312">30</text><text x="990" y="312">40.00</text><text x="1072" y="312">40.00</text><text x="1148" y="312">USD</text></g>
  </g>

  <!-- chart block -->
  <text x="640" y="370" fill="#3C4043" font-size="13" font-weight="700">Workaround cost by priority ($)</text>
  <g>
    <rect x="640" y="390" width="420" height="28" fill="#C5221F" rx="3"/>
    <text x="1070" y="409" fill="#3C4043" font-size="12">Critical — 560</text>
    <rect x="640" y="426" width="392" height="28" fill="#E37400" rx="3"/>
    <text x="1042" y="445" fill="#3C4043" font-size="12">High — 733</text>
    <rect x="640" y="462" width="156" height="28" fill="#F9AB00" rx="3"/>
    <text x="806" y="481" fill="#3C4043" font-size="12">Medium — 207</text>
    <rect x="640" y="498" width="32" height="28" fill="#188038" rx="3"/>
    <text x="682" y="517" fill="#3C4043" font-size="12">Low — 40</text>
  </g>

  <text x="640" y="580" fill="#5F6368" font-size="12">Summary: 12 active items · $1,540.00 workaround cost · $760.00 estimated fix cost</text>
  <text x="640" y="602" fill="#5F6368" font-size="12">Generated by Technical Debt Accountant — Tools → Export Debt Inventory…</text>

  <rect y="776" width="1280" height="24" fill="#3C3F41"/>
  <text x="16" y="792" fill="#808080" font-size="12">Exported 12 debt item(s) to ~/reports/debt-inventory.csv</text>
</svg>
