<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <style>
      .mono { font-family: 'JetBrains Mono', 'SF Mono', Menlo, monospace; }
      .h1 { fill: #DDDDDD; font-size: 22px; font-weight: 700; }
      .lbl { fill: #9DA0A3; font-size: 14px; }
      .val { fill: #DDDDDD; font-size: 16px; font-weight: 600; }
    </style>
  </defs>

  <!-- IDE background -->
  <rect width="1280" height="800" fill="#2B2B2B"/>

  <!-- Window title bar -->
  <rect width="1280" height="36" fill="#3C3F41"/>
  <circle cx="22" cy="18" r="6" fill="#FF5F57"/>
  <circle cx="42" cy="18" r="6" fill="#FEBC2E"/>
  <circle cx="62" cy="18" r="6" fill="#28C840"/>
  <text x="640" y="23" text-anchor="middle" fill="#9DA0A3" font-size="13">acme-payments — IntelliJ IDEA</text>

  <!-- Tool window header -->
  <rect y="36" width="1280" height="30" fill="#313335"/>
  <text x="16" y="56" fill="#BBBBBB" font-size="13" font-weight="600">Tech Debt — Debt Health</text>

  <!-- Health panel -->
  <rect x="40" y="96" width="1200" height="372" rx="10" fill="#313335" stroke="#45494A"/>
  <text x="72" y="140" class="h1">Technical Debt Health</text>
  <text x="72" y="166" class="lbl">Quantified debt pressure for acme-payments, graded A–F so anyone can read it at a glance.</text>

  <!-- Grade gauge -->
  <circle cx="220" cy="300" r="92" fill="none" stroke="#4A4E50" stroke-width="14"/>
  <!-- 63% arc (amber), starting at top, clockwise -->
  <path d="M220,208 A92,92 0 1 1 152.9,363.0" fill="none" stroke="#E5C07B" stroke-width="14" stroke-linecap="round"/>
  <text x="220" y="312" text-anchor="middle" fill="#E5C07B" font-size="78" font-weight="800">C</text>
  <text x="220" y="416" text-anchor="middle" fill="#9DA0A3" font-size="16">Score 63 / 100 · Fair</text>

  <!-- Metrics -->
  <g>
    <text x="420" y="214" class="lbl">Active debt items</text>
    <text x="420" y="244" class="val">12</text>

    <text x="420" y="292" class="lbl">Weighted severity</text>
    <text x="420" y="322" class="val">29.0</text>

    <text x="420" y="370" class="lbl">Monthly interest</text>
    <text x="420" y="400" class="val" fill="#73C991">$640.00 / mo</text>
  </g>
  <g>
    <text x="760" y="214" class="lbl">Estimated payoff cost</text>
    <text x="760" y="244" class="val" fill="#E5C07B">$5,120.00</text>

    <text x="760" y="292" class="lbl">Monthly budget</text>
    <text x="760" y="322" class="val">$500.00 / mo</text>

    <text x="760" y="370" class="lbl">Budget status</text>
    <rect x="760" y="382" width="148" height="26" rx="13" fill="#5A2D2D"/>
    <text x="772" y="400" fill="#E06C75" font-size="14" font-weight="700">⚠ OVER BUDGET</text>
  </g>

  <!-- Tip -->
  <rect x="40" y="496" width="1200" height="40" rx="8" fill="#2F3B2F"/>
  <text x="60" y="521" fill="#98C379" font-size="14">The grade also appears in the status bar and in management reports — and the CLI can fail CI builds when the debt budget is exceeded.</text>

  <!-- Tooltip callout near status bar -->
  <rect x="900" y="588" width="312" height="118" rx="8" fill="#23262A" stroke="#45494A"/>
  <text x="920" y="614" fill="#DDDDDD" font-size="13" font-weight="700">Technical Debt Health: C (Fair)</text>
  <text x="920" y="636" fill="#BBBBBB" font-size="13">Score: 63/100</text>
  <text x="920" y="656" fill="#BBBBBB" font-size="13">Active items: 12</text>
  <text x="920" y="676" fill="#BBBBBB" font-size="13">Monthly interest: $640.00</text>
  <text x="920" y="696" fill="#E06C75" font-size="13">Budget: $500.00/mo (OVER BUDGET)</text>
  <path d="M1050 706 L1066 706 L1058 724 Z" fill="#23262A" stroke="#45494A"/>

  <!-- status bar -->
  <rect y="776" width="1280" height="24" fill="#3C3F41"/>
  <text x="16" y="792" fill="#808080" font-size="12">acme-payments · main</text>
  <rect x="1040" y="780" width="168" height="16" rx="3" fill="#45494A"/>
  <text x="1052" y="792" fill="#E5C07B" font-size="12" font-weight="600">Debt C</text>
  <text x="1100" y="792" fill="#BBBBBB" font-size="12">· $640.00/mo</text>
</svg>
